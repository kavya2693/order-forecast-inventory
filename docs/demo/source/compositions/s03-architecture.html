<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #arch-root { position: absolute; inset: 0; }
        #arch-root .diagram { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 620px; }
        #arch-root svg.wires { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        #arch-root .wire { fill: none; stroke-width: 3.5; stroke-linejoin: round; }
        #arch-root .layer-lab {
          position: absolute; top: 214px; font-family: var(--mono); font-size: 20px; font-weight: 700;
          letter-spacing: 0.14em; white-space: nowrap;
        }
        #arch-root .layer-lab span { color: var(--ink-mute); font-weight: 400; letter-spacing: 0.02em; }
        #arch-root .node {
          position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 6px;
          padding: 0 22px; border: 2px solid var(--line); border-radius: 14px; background: var(--panel);
        }
        #arch-root .node .t { font-size: 27px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
        #arch-root .node .s { font-family: var(--mono); font-size: 20px; color: var(--ink-soft); white-space: nowrap; }
        #arch-root .f {
          position: absolute; right: 14px; top: -16px; font-family: var(--mono); font-size: 20px; padding: 1px 10px;
          border-radius: 6px; background: var(--bg); border: 2px solid var(--line); white-space: nowrap;
        }
        #arch-root .L-data { border-color: rgba(127, 168, 255, 0.55); }
        #arch-root .L-data .f { color: var(--c-data); }
        #arch-root .L-model { border-color: rgba(185, 162, 255, 0.6); }
        #arch-root .L-model .f { color: var(--c-model); }
        #arch-root .L-risk { border: 2px dashed rgba(255, 138, 115, 0.75); background: #1a1517; padding-top: 10px; }
        #arch-root .L-risk .f { color: var(--c-risk); }
        #arch-root .hero-m { border: 3px solid var(--c-model); background: #1a1830; }
        #arch-root .hero-o { border: 3px solid var(--c-opt); background: #0f2629; }
        #arch-root .hero-o .t, #arch-root .hero-m .t { font-size: 31px; }
        #arch-root .hero-o .f, #arch-root .hero-m .f { left: 14px; right: auto; }
        #arch-root .hero-o .f { color: var(--c-opt); }
        #arch-root .hero-m .f { color: var(--c-model); }
        #arch-root .chips { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 22px; color: var(--ink-mute); }
        #arch-root .chips b {
          display: block; font-weight: 700; font-size: 20px; color: var(--c-model); padding: 3px 6px; border-radius: 8px;
          border: 2px solid rgba(185, 162, 255, 0.55); background: rgba(185, 162, 255, 0.1); white-space: nowrap;
        }
        #arch-root .formula { font-family: var(--mono); font-size: 30px; font-weight: 700; color: var(--c-opt); white-space: nowrap; }
        #arch-root .ctrl { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
        #arch-root .ctrl i { display: block; width: 16px; height: 16px; background: var(--c-eval); transform: rotate(45deg); border-radius: 2px; flex: 0 0 auto; }
        #arch-root .ctrl span { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--c-eval); white-space: nowrap; }
        #arch-root .nfr { font-family: var(--mono); font-size: 20px; color: var(--c-eval); white-space: nowrap; }
        /* SQL container */
        #arch-root .box-sql {
          position: absolute; border: 2px dashed rgba(127, 168, 255, 0.45); border-radius: 18px; background: rgba(127, 168, 255, 0.035);
        }
        #arch-root .box-sql .hd { position: absolute; left: 22px; top: 10px; font-family: var(--mono); font-size: 20px; color: var(--c-data); white-space: nowrap; }
        #arch-root .box-sql .hd span { color: var(--c-eval); }
        /* cylinders = data stores */
        #arch-root .cyl { position: absolute; }
        #arch-root .cyl svg { position: absolute; left: 0; top: 0; overflow: visible; }
        #arch-root .cyl .txt { position: absolute; left: 0; right: 0; bottom: 10px; top: 26px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; }
        #arch-root .cyl .t { font-size: 24px; font-weight: 700; color: var(--ink); white-space: nowrap; }
        #arch-root .cyl .s { font-family: var(--mono); font-size: 20px; color: var(--ink-soft); white-space: nowrap; }
        /* document = output files */
        #arch-root .doc { position: absolute; padding: 20px 22px 14px; background: var(--panel); border: 2px solid rgba(63, 216, 168, 0.6);
          border-radius: 6px 30px 6px 6px; display: flex; flex-direction: column; gap: 3px; }
        #arch-root .doc .t { font-size: 25px; font-weight: 700; color: var(--ink); white-space: nowrap; }
        #arch-root .doc .s { font-family: var(--mono); font-size: 20px; color: var(--ink-soft); white-space: nowrap; }
        #arch-root .doc .f { left: 14px; right: auto; color: var(--c-opt); }
        /* evaluation band */
        #arch-root .band {
          position: absolute; display: flex; align-items: center; gap: 30px; padding: 6px 26px 0;
          border: 2px solid rgba(242, 196, 109, 0.65); border-radius: 14px; background: #1b1a17;
        }
        #arch-root .band .f { left: 14px; right: auto; color: var(--c-eval); }
        #arch-root .band .t { font-size: 27px; font-weight: 700; color: var(--ink); white-space: nowrap; }
        #arch-root .band .s { font-family: var(--mono); font-size: 20px; color: var(--ink-soft); white-space: nowrap; }
        #arch-root .band .s b { color: var(--c-eval); font-weight: 700; }
        #arch-root .tline { display: flex; height: 34px; font-family: var(--mono); font-size: 20px; font-weight: 700; }
        #arch-root .tline div { display: flex; align-items: center; justify-content: center; border-radius: 6px; margin-right: 4px; white-space: nowrap; }
        #arch-root .wire-label { position: absolute; font-family: var(--mono); font-size: 20px; white-space: nowrap; }
        #arch-root .legend, #arch-root .cp {
          position: absolute; left: 560px; top: 1008px; display: flex; gap: 24px; align-items: center;
          font-family: var(--mono); font-size: 20px; color: var(--ink-soft); white-space: nowrap;
        }
        #arch-root .cp { color: var(--c-opt); font-weight: 700; gap: 12px; }
        #arch-root .cp i { display: block; width: 30px; height: 6px; border-radius: 3px; background: var(--c-opt); }
        #arch-root .legend span { display: flex; align-items: center; gap: 9px; }
        #arch-root .legend i { display: block; width: 15px; height: 15px; border-radius: 4px; }
        #arch-root .legend svg { width: 40px; height: 12px; }
      </style>

      <div id="arch-root" data-composition-id="arch" data-width="1920" data-height="1080">
        <div class="scene" id="arch-in">
          <div class="eyebrow" data-layout-allow-overlap id="arch-eyebrow">05 · Architecture</div>
          <div class="scene-title" data-layout-allow-overlap id="arch-title">Three sources, one SQL panel, one stock decision.</div>
          <div class="diagram" id="arch-diagram">
            <svg class="wires" viewBox="0 0 1920 1080" id="arch-svg"></svg>
            <div id="arch-nodes"></div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = 14.8;
          const NS = "http://www.w3.org/2000/svg";
          const COL = { data: "#7fa8ff", model: "#b9a2ff", opt: "#3fd8a8", eval: "#f2c46d", risk: "#ff8a73" };
          const host = document.getElementById("arch-nodes");
          const svg = document.getElementById("arch-svg");
          const H = [];
          const add = (h) => H.push(h);

          // ================= layers, left -> right =================
          add('<div class="layer-lab" id="arch-h1" style="left:100px;color:var(--c-data)">① SOURCES <span>data.py</span></div>');
          add('<div class="layer-lab" id="arch-h2" style="left:500px;color:var(--c-data)">② SQL FEATURE LAYER</div>');
          add('<div class="layer-lab" id="arch-h3" style="left:970px;color:var(--c-model)">③ MODELS</div>');
          add('<div class="layer-lab" id="arch-h4" style="left:1420px;color:var(--c-opt)">④ DECISION</div>');

          // ① data stores (cylinders)
          const cyl = (id, x, y, w, h, t, s, col) => {
            const ry = 13;
            add('<div class="cyl" id="' + id + '" style="left:' + x + "px;top:" + y + "px;width:" + w + "px;height:" + h + 'px">' +
              '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h + '">' +
              '<path d="M1 ' + ry + "V" + (h - ry) + "A" + (w / 2 - 1) + " " + ry + " 0 0 0 " + (w - 1) + " " + (h - ry) + "V" + ry + '" fill="#0f1a26" stroke="' + col + '" stroke-opacity="0.75" stroke-width="2"/>' +
              '<ellipse cx="' + w / 2 + '" cy="' + ry + '" rx="' + (w / 2 - 1) + '" ry="' + ry + '" fill="#18293f" stroke="' + col + '" stroke-opacity="0.75" stroke-width="2"/></svg>' +
              '<div class="txt"><div class="t">' + t + '</div><div class="s">' + s + "</div></div></div>");
          };
          cyl("n-a1", 100, 266, 262, 122, "sales_orders", "ERP · 604,527 lines", COL.data);
          cyl("n-a2", 100, 416, 262, 122, "shipments", "WMS/TMS · 592,904", COL.data);
          cyl("n-a3", 100, 566, 262, 122, "field_app_events", "reps' app · 279,330", COL.data);
          cyl("n-a4", 100, 716, 262, 106, "customers · skus", "400 · 150 rows", COL.data);

          // ② SQL feature layer (three DuckDB stages) + the feature store
          add('<div class="box-sql" id="n-bx" style="left:500px;top:256px;width:390px;height:452px"><div class="hd">pipeline.py · DuckDB</div></div>');
          add('<div class="node L-data" id="n-b1" style="left:524px;top:318px;width:342px;height:124px"><div class="f">01_staging.sql</div>' +
            '<div class="t">Clean + dedupe</div><div class="s">−11,623 cancelled lines</div><div class="s">−8,136 API retries</div></div>');
          add('<div class="node L-data" id="n-b2" style="left:524px;top:462px;width:342px;height:96px"><div class="f">02_panel.sql</div>' +
            '<div class="t">Weekly panel</div><div class="s">zero weeks made explicit</div></div>');
          add('<div class="node L-data" id="n-b3" style="left:524px;top:588px;width:342px;height:96px"><div class="f">03_features.sql</div>' +
            '<div class="t">Features as of week t</div><div class="s">lags · app · logistics</div></div>');
          cyl("n-b4", 540, 762, 310, 116, "features", "1,337,363 line-weeks", COL.data);

          // ③ models
          add('<div class="node L-model hero-m" id="n-c1" style="left:970px;top:262px;width:345px;height:258px"><div class="f">models.py · TwoStage</div>' +
            '<div class="t">Two-stage forecast</div>' +
            '<div class="chips"><b>P(order)</b>×<b>E[qty|order]</b></div>' +
            '<div class="s">LightGBM · XGBoost</div><div class="s">1 and 2 weeks ahead</div>' +
            '<div class="nfr">fit on 916,478 rows</div></div>');
          add('<div class="node L-model" id="n-c2" style="left:970px;top:552px;width:345px;height:98px"><div class="f">models.py</div>' +
            '<div class="t">Tweedie, one stage</div><div class="s">challenger</div></div>');
          add('<div class="node L-model" id="n-c3" style="left:970px;top:682px;width:345px;height:98px"><div class="f">baseline.py</div>' +
            '<div class="t">ETS per line</div><div class="s">+ 4-week moving avg</div></div>');

          // ④ decision: the control point (z search), its fallback, and the outputs
          add('<div class="node hero-o" id="n-d1" style="left:1420px;top:262px;width:390px;height:258px"><div class="f">inventory.py</div>' +
            '<div class="t">Order-up-to policy</div>' +
            '<div class="formula">S = F₁ + F₂ + z·σ</div>' +
            '<div class="s">Σ lines → SKU · 1-wk lead</div>' +
            '<div class="ctrl"><i></i><span>z_for_fill_rate()</span></div>' +
            '<div class="s">bisect z until 98% fill</div></div>');
          add('<div class="doc" id="n-d3" style="left:1600px;top:578px;width:210px;height:160px"><div class="f">cli.py</div>' +
            '<div class="t">outputs/</div><div class="s">inventory.csv</div><div class="s">accuracy.csv</div><div class="s">results.md</div></div>');
          add('<div class="node L-risk" id="n-d2" style="left:1600px;top:772px;width:210px;height:92px"><div class="f">evaluate.py</div>' +
            '<div class="t" style="font-size:24px">fixed z = 1.65</div><div class="s">fallback</div></div>');

          // ⑤ evaluation band (backtest split, metrics, ablation, run time)
          add('<div class="band" id="n-e1" style="left:100px;top:902px;width:1710px;height:84px"><div class="f">⑤ evaluate.py · metrics.py</div>' +
            '<div class="t">Backtest</div>' +
            '<div class="tline"><div style="width:250px;background:rgba(178,191,204,0.14);color:var(--ink-soft)">train</div>' +
            '<div style="width:130px;background:rgba(242,196,109,0.28);color:var(--c-eval)">val 13 wk</div>' +
            '<div style="width:160px;background:var(--c-eval);color:#1b1a17">test 26 wk</div></div>' +
            '<div class="s">1 − WAPE · bias · fill · <b>holding cost</b></div>' +
            '<div class="s">ablation ×3</div>' +
            '<div class="s"><b>523 s</b> full run</div></div>');

          // wire labels: what flows on each edge
          const lab = (id, x, y, txt, c) => add('<div class="wire-label" id="' + id + '" style="left:' + x + "px;top:" + y + "px;color:" + c + '">' + txt + "</div>");
          lab("arch-l-raw", 411, 340, "parquet", "var(--c-data)");
          lab("arch-l-row", 455, 722, "1 row / line / week", "var(--c-data)");
          lab("arch-l-panel", 856, 786, "panel", "var(--c-data)");
          lab("arch-l-f", 1332, 356, "F₁, F₂", "var(--c-model)");
          lab("arch-l-fc", 1147, 826, "test forecasts", "var(--c-model)");
          lab("arch-l-qty", 1662, 526, "order qty", "var(--c-opt)");
          lab("arch-l-nan", 1464, 690, "z = NaN", "var(--c-risk)");
          lab("arch-l-sigma", 1464, 846, "σ / SKU", "var(--c-eval)");

          add('<div class="legend" id="arch-legend">' +
            '<span><i style="background:var(--c-data)"></i>data</span><span><i style="background:var(--c-model)"></i>models</span>' +
            '<span><i style="background:var(--c-opt)"></i>decision</span><span><i style="background:var(--c-eval)"></i>evaluation</span>' +
            '<span><svg viewBox="0 0 40 12"><path d="M0 6H40" stroke="#b2bfcc" stroke-width="3"/></svg>batch hand-off</span>' +
            '<span><svg viewBox="0 0 40 12"><path d="M0 6H40" stroke="#f2c46d" stroke-width="3" stroke-dasharray="8 6"/></svg>feedback</span>' +
            '<span><svg viewBox="0 0 40 12"><path d="M2 6H40" stroke="#ff8a73" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/></svg>fallback</span></div>');
          add('<div class="cp" id="arch-cp"><i></i>critical path: orders → SQL → features → two-stage → policy → outputs</div>');
          host.innerHTML = H.join("");

          // ================= wires (orthogonal; coordinates match the boxes above) =================
          // step = order in the packet flow (execution order); crit = on the critical path
          const wires = [
            { id: "a1", pts: [[362, 327], [416, 327], [416, 370], [524, 370]], c: "data", at: 1.5, step: 0, crit: true },
            { id: "a2", pts: [[362, 477], [416, 477], [416, 370], [524, 370]], c: "data", at: 1.5, step: 0 },
            { id: "a3", pts: [[362, 627], [416, 627], [416, 370], [524, 370]], c: "data", at: 1.5, step: 0 },
            { id: "a4", pts: [[362, 769], [416, 769], [416, 370], [524, 370]], c: "data", at: 1.5, step: 0 },
            { id: "b12", pts: [[695, 442], [695, 462]], c: "data", at: 2.45, step: 1.1, crit: true },
            { id: "b23", pts: [[695, 558], [695, 588]], c: "data", at: 2.6, step: 1.5, crit: true },
            { id: "b34", pts: [[695, 684], [695, 762]], c: "data", at: 2.8, step: 1.9, crit: true },
            { id: "bc1", pts: [[850, 820], [930, 820], [930, 391], [970, 391]], c: "data", at: 3.4, step: 2.5, crit: true },
            { id: "bc2", pts: [[850, 820], [930, 820], [930, 601], [970, 601]], c: "data", at: 3.4, step: 2.5 },
            { id: "bc3", pts: [[850, 820], [930, 820], [930, 731], [970, 731]], c: "data", at: 3.4, step: 2.5 },
            { id: "cd1", pts: [[1315, 391], [1420, 391]], c: "model", at: 4.5, step: 3.4, crit: true },
            { id: "cd2", pts: [[1315, 601], [1360, 601], [1360, 470], [1420, 470]], c: "model", at: 4.5, step: 3.4 },
            { id: "cd3", pts: [[1315, 731], [1380, 731], [1380, 495], [1420, 495]], c: "model", at: 4.5, step: 3.4 },
            { id: "ce", pts: [[1135, 780], [1135, 902]], c: "model", at: 6.2, step: 3.4 },
            { id: "sig", pts: [[1450, 902], [1450, 520]], c: "eval", at: 6.6, step: 4.3, style: "dash" },
            { id: "dd3", pts: [[1650, 520], [1650, 578]], c: "opt", at: 5.3, step: 5.2, crit: true },
            { id: "fb", pts: [[1580, 520], [1580, 818], [1600, 818]], c: "risk", at: 5.8, style: "dot" },
            { id: "fb2", pts: [[1705, 772], [1705, 738]], c: "risk", at: 6.0, style: "dot" },
          ];
          const lenOf = (pts) => pts.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);
          wires.forEach((w) => {
            const p = document.createElementNS(NS, "path");
            p.setAttribute("d", "M" + w.pts.map((q) => q.join(" ")).join(" L"));
            p.setAttribute("class", "wire");
            p.setAttribute("id", "arch-w-" + w.id);
            p.setAttribute("stroke", COL[w.c]);
            p.setAttribute("opacity", "0");
            w.len = lenOf(w.pts);
            w.el = p;
            svg.appendChild(p);
            // arrow head: a separate triangle at the end point, shown once the wire has been drawn
            const [x1, y1] = w.pts[w.pts.length - 1], [x0, y0] = w.pts[w.pts.length - 2];
            const ang = (Math.atan2(y1 - y0, x1 - x0) * 180) / Math.PI;
            const ah = document.createElementNS(NS, "path");
            ah.setAttribute("d", "M0 0L-13 -7L-13 7z");
            ah.setAttribute("fill", COL[w.c]);
            ah.setAttribute("transform", "translate(" + x1 + " " + y1 + ") rotate(" + ang + ")");
            ah.setAttribute("opacity", "0");
            svg.appendChild(ah);
            w.ah = ah;
            const drawDur = w.style ? 0.5 : Math.max(0.3, w.len / 900);
            tl.fromTo(ah, { attr: { opacity: 0 } }, { attr: { opacity: 0.95 }, duration: 0.15 }, w.at + drawDur - 0.1);
            if (w.style) {
              p.setAttribute("stroke-dasharray", w.style === "dash" ? "12 8" : "2 9");
              if (w.style === "dot") p.setAttribute("stroke-linecap", "round");
              tl.fromTo(p, { attr: { opacity: 0 } }, { attr: { opacity: 0.9 }, duration: 0.5 }, w.at);
            } else {
              p.setAttribute("stroke-dasharray", w.len + " " + w.len);
              tl.fromTo(p, { attr: { opacity: 0.85, "stroke-dashoffset": w.len } }, { attr: { opacity: 0.85, "stroke-dashoffset": 0 }, duration: Math.max(0.3, w.len / 900), ease: "power2.inOut" }, w.at);
            }
          });

          // ================= build, layer by layer =================
          tl.fromTo("#arch-in", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
          tl.fromTo("#arch-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#arch-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
          tl.fromTo("#arch-diagram", { scale: 0.975 }, { scale: 1, duration: D, ease: "sine.out" }, 0);
          const pop = (sel, at, from) =>
            tl.fromTo(sel, Object.assign({ opacity: 0, x: 0, y: 0 }, from), { opacity: 1, x: 0, y: 0, duration: 0.5, ease: "power3.out" }, at);
          pop("#arch-h1", 0.6, { y: 10 });
          ["#n-a1", "#n-a2", "#n-a3", "#n-a4"].forEach((s, i) => pop(s, 0.75 + i * 0.12, { x: -30 }));
          tl.fromTo("#arch-l-raw", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.9);
          pop("#arch-h2", 1.7, { y: 10 });
          tl.fromTo("#n-bx", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.8);
          pop("#n-b1", 2.0, { y: 16 });
          pop("#n-b2", 2.3, { y: 16 });
          pop("#n-b3", 2.5, { y: 16 });
          pop("#n-b4", 2.9, { y: 16 });
          tl.fromTo(["#arch-l-row", "#arch-l-panel"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.2);
          pop("#arch-h3", 3.3, { y: 10 });
          pop("#n-c1", 3.5, { y: 20 });
          pop("#n-c2", 3.7, { y: 20 });
          pop("#n-c3", 3.85, { y: 20 });
          tl.fromTo("#arch-l-f", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.8);
          pop("#arch-h4", 4.4, { y: 10 });
          tl.fromTo("#n-d1", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 4.6);
          pop("#n-d3", 5.4, { x: -16 });
          tl.fromTo("#arch-l-qty", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.5);
          pop("#n-d2", 5.9, { x: -16 });
          tl.fromTo("#arch-l-nan", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.0);
          pop("#n-e1", 6.1, { y: 24 });
          tl.fromTo(["#arch-l-fc", "#arch-l-sigma"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.6);
          tl.fromTo("#arch-legend", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 6.8);

          // ================= data packets, in execution order =================
          const FLOW0 = 7.3, FLOW_END = 11.9, SPEED = 560, STEP = 0.5;
          wires.forEach((w) => {
            if (w.step === undefined) return;
            const pts = w.pts;
            const travel = Math.max(0.35, w.len / SPEED);
            const kf = [];
            for (let i = 1; i < pts.length; i++) {
              const seg = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
              kf.push({ attr: { cx: pts[i][0], cy: pts[i][1] }, duration: (travel * seg) / w.len, ease: "none" });
            }
            const start0 = FLOW0 + w.step * STEP;
            const gap = Math.max(travel * 0.6, 0.5);
            for (let k = 0; k < 5; k++) {
              const start = start0 + k * gap;
              if (start + travel > FLOW_END) break;
              const c = document.createElementNS(NS, "circle");
              c.setAttribute("r", "7"); c.setAttribute("cx", pts[0][0]); c.setAttribute("cy", pts[0][1]);
              c.setAttribute("fill", COL[w.c]); c.setAttribute("opacity", "0");
              svg.appendChild(c);
              tl.fromTo(c, { attr: { opacity: 0, cx: pts[0][0], cy: pts[0][1] } }, { attr: { opacity: 1 }, duration: 0.1 }, start);
              tl.to(c, { keyframes: kf }, start);
              tl.to(c, { attr: { opacity: 0 }, duration: 0.12 }, start + travel - 0.04);
            }
          });

          // ================= critical path highlight =================
          const CP = 12.0;
          tl.to(wires.filter((w) => !w.crit).map((w) => w.el), { attr: { opacity: 0.22 }, duration: 0.5 }, CP);
          tl.to(["#n-a2", "#n-a3", "#n-a4", "#n-c2", "#n-c3", "#n-d2", "#n-e1", "#arch-l-fc", "#arch-l-sigma", "#arch-l-nan"], { opacity: 0.35, duration: 0.5 }, CP);
          wires.filter((w) => w.crit).forEach((w, i) => {
            tl.to(w.el, { attr: { stroke: COL.opt, "stroke-width": 6, opacity: 1 }, duration: 0.3 }, CP + 0.2 + i * 0.16);
            tl.to(w.ah, { attr: { fill: COL.opt }, duration: 0.3 }, CP + 0.2 + i * 0.16);
          });
          tl.to(wires.filter((w) => !w.crit).map((w) => w.ah), { attr: { opacity: 0.22 }, duration: 0.5 }, CP);
          ["#n-a1", "#n-b1", "#n-b2", "#n-b3", "#n-b4", "#n-c1", "#n-d1", "#n-d3"].forEach((s, i) =>
            tl.to(s, { filter: "drop-shadow(0 0 12px rgba(63,216,168,0.8))", duration: 0.3 }, CP + 0.15 + i * 0.18));
          tl.to("#arch-legend", { opacity: 0, duration: 0.3 }, CP);
          tl.fromTo("#arch-cp", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, CP + 0.3);
          tl.to("#arch-in", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.4);
          window.__timelines["arch"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
