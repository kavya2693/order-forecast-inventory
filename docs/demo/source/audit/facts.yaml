  - {id: F-29, slides: ["06"], label: "Average stock value at 98% fill, ETS", shown: "ETS 969,484", type: direct, source: "outputs/inventory.csv", key: "method=ets, avg_inventory_value_matched", formula: "-",
     check: {expr: "row('outputs/inventory.csv', method='ets')['avg_inventory_value_matched']", fmt: "{:,.0f}", expect: "969,484"}}
  - {id: F-30, slides: ["06"], label: "Average stock value at 98% fill, two-stage LightGBM", shown: "two-stage 516,188", type: direct, source: "outputs/inventory.csv", key: "method=lgbm_two_stage, avg_inventory_value_matched", formula: "-",
     check: {expr: "row('outputs/inventory.csv', method='lgbm_two_stage')['avg_inventory_value_matched']", fmt: "{:,.0f}", expect: "516,188"}}
  - {id: F-31, slides: ["06"], label: "Average stock change", shown: "−46.8%", type: derived, source: "outputs/inventory.csv", key: "F-30 vs F-29", formula: "(516,188 - 969,484) / 969,484 x 100 = -46.76%",
     check: {expr: "(row('outputs/inventory.csv', method='lgbm_two_stage')['avg_inventory_value_matched'] / row('outputs/inventory.csv', method='ets')['avg_inventory_value_matched'] - 1) * 100", fmt: "{:+.1f}%", expect: "-46.8%"}}
  - {id: F-32, slides: ["06"], label: "Phase B weekly stock-value lines average to the published numbers", shown: "two weekly lines, Jul-Dec", type: derived, source: "demo assets/order_list.json stock_value_weekly", key: "mean of weeks 3-26 (after the 2 warm-up weeks)", formula: "mean = avg_inventory_value_matched",
