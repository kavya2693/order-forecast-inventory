     check: {expr: "len(R('outputs/ablation.csv')) - 1", fmt: "{:d}", expect: "3"}}
  - {id: F-27, slides: ["05"], label: "Policy constants on the decision box", shown: "1-wk lead · 98% fill · horizons 1 and 2", type: direct, source: "src/order_forecast/config.py:25-34", key: "LEAD_TIME_WEEKS = 1; TARGET_FILL_RATE = 0.98", formula: "-",
     check: {expr: "grep('src/order_forecast/config.py', r'LEAD_TIME_WEEKS = 1') and grep('src/order_forecast/config.py', r'TARGET_FILL_RATE = 0.98')", fmt: bool}}
  # ---- slide 06
  - {id: F-28, slides: ["06"], label: "Phase A: one SKU's weekly orders and one-week-ahead forecasts (two-stage LightGBM, ETS)", shown: "SKU S0032 chart (26 bars, 2 lines)", type: direct, source: "demo assets/order_list.json trace (re-run of make run; S0032 = 20th SKU by test-window demand)", key: "trace.demand, forecast_h1_lgbm, forecast_h1_ets", formula: "line forecasts summed to SKU, origin = week before",
