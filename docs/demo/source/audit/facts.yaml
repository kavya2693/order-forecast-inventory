     check: {expr: "f\"{13 if grep('src/order_forecast/config.py', r'VAL_WEEKS = 13') else 0} · {J('outputs/metrics.json')['split']['test_weeks']} · {round(J('outputs/metrics.json')['runtime_seconds'])}\"", fmt: "{}", expect: "13 · 26 · 523"}}
