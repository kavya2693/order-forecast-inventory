  - {id: F-33, slides: ["07"], label: "Order list date and arrival", shown: "FRI 2025-09-26 · ARRIVES MON 2025-10-06", type: direct, source: "demo assets/order_list.json decision", key: "friday, arrives (test week 13 + 2 weeks lead)", formula: "week_start 2025-09-22 + 4 days; arrival = start of week t+2",
     check: {expr: "(lambda d: f\"{d['friday']} · {d['arrives']}\")(J('demo:assets/order_list.json')['decision'])", fmt: "{}", expect: "2025-09-26 · 2025-10-06"}}
  - {id: F-34, slides: ["07"], label: "Six sheet rows (on hand, in transit, need 2 wk, safety, order, buyers)", shown: "S0108, S0014, S0005, S0066, S0131, S0044", type: direct, source: "demo assets/order_list.json, injected into compositions/value.html", key: "decision.rows", formula: "order = need 2 wk + safety - on hand - in transit; buyers = Σ P(order) over the SKU's lines / lines",
     check: {expr: "sheet_rows_match()", fmt: bool}}
