# Audit facts for the order-forecast-inventory demo video.
# Read by ~/Work/hyperframes/demos/tools/build_audit_report.py.
#
# Check expressions are Python, evaluated with these helpers (paths relative to the repo root;
# a "demo:" prefix means relative to the demo project folder):
#   R(path) -> pandas DataFrame from CSV      J(path) -> parsed JSON
#   row(path, **eq) -> the single CSV row matching all equalities (a pandas Series)
#   T(path) -> file text                      grep(path, regex) -> True/False
# A check passes when fmt.format(value) == expect (or, with fmt "bool", when value is True).

project:
  name: order-forecast-inventory
  title: "order-forecast-inventory: demo video audit report"
  repo_url: https://github.com/kavya2693/order-forecast-inventory
  repo_dir: ../../../..          # paths are relative to this file
  demo_dir: ..
  demo_display: docs/demo/source
  out_dir: ../..
  video: docs/demo/demo.mp4
  video_duration_s: 88.8
  outputs_dir: outputs
  venv_python: .venv/bin/python
  version_packages: [lightgbm, xgboost, duckdb, pandas, numpy, sklearn]
  regenerate:
    - "make run                                   # data/raw/*.parquet + outputs/*.csv, metrics.json (about 9 min)"
    - "PYTHONPATH=src .venv/bin/python docs/demo/source/tools/export_order_list.py docs/demo/source/assets/order_list.json   # about 4 min"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/order_list.json docs/demo/source/compositions/value.html docs/demo/source/compositions/s04-routes.html --rows S0108,S0014,S0005,S0066,S0131,S0044"
    - "cd docs/demo/source && npx --yes hyperframes@0.8.156 check && npx --yes hyperframes@0.8.156 render -f 30 -q looks -o renders/order-forecast-inventory-master.mp4 && cd -"
    - "ffmpeg -y -i docs/demo/source/renders/order-forecast-inventory-master.mp4 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an docs/demo/demo.mp4"
    - "python3 docs/demo/source/tools/build_audit_report.py docs/demo/source/audit/facts.yaml   # stills, checks, MD/DOCX/PDF"
  seeds: {scale: FULL, seed: 7, model_random_state: 0}
  run_time: "metrics.json runtime_seconds = 522.6 s (about 8.7 min) for make run on the author's laptop, ORDER_FORECAST_THREADS=1"

assumptions:
  - id: A-01
    statement: "All data is synthetic, produced by a seeded generator sized to the production problem (400 customers, 150 SKUs, 156 weeks, five source tables). The production data is proprietary."
    source: "src/order_forecast/config.py:8-13 (Scale, seed=7); src/order_forecast/data.py:55 (generate); README 'The data'"
    figures: []
    all_figures: true
    edit: ["src/order_forecast/config.py (Scale)", "src/order_forecast/data.py"]
    rerun: ["make run"]
  - id: A-02
    statement: "The field-app lift is a property of the generator: a quote request precedes an order with a probability chosen in data.py (45% when an order is coming, 4% otherwise). Real quote logs may carry less signal."
    source: "src/order_forecast/data.py:169; README 'Known limitations' (biggest gap)"
    figures: [F-24, F-25, F-31, F-32, F-33, F-34, F-36, F-37, F-38, F-41, F-42]
    edit: ["src/order_forecast/data.py:169"]
    rerun: ["make run", "export_order_list.py + inject_sheet.py"]
  - id: A-03
    statement: "Carrying stock costs 25% of its value a year; holding cost = weekly stock value x 0.25 / 52, annualised."
    source: "src/order_forecast/config.py:32 (ANNUAL_HOLDING_RATE = 0.25); inventory.py:62-63"
    figures: [F-07, F-15, F-31, F-36, F-37, F-38, F-41, F-42, F-43, F-44, F-45]
    edit: ["src/order_forecast/config.py:32"]
    rerun: ["make run"]
  - id: A-04
    statement: "Inventory policy: weekly order-up-to S = F(t+1) + F(t+2) + z x sigma per SKU, one week lead time (an order placed at the end of week t arrives at the start of week t+2), lost sales, two warm-up weeks not scored, no case packs, minimums or capacity."
    source: "src/order_forecast/inventory.py:1-8, :46-67; config.py:26-35; README 'Known limitations'"
    figures: [F-12, F-13, F-15, F-27, F-31, F-33, F-34, F-36, F-37, F-38, F-39, F-40, F-41, F-42, F-43]
    edit: ["src/order_forecast/config.py:26-35", "src/order_forecast/inventory.py"]
    rerun: ["make run", "export_order_list.py + inject_sheet.py"]
  - id: A-05
    statement: "Safety stock sigma for each forecaster is the RMSE of its own two-week SKU forecast over the 13 validation weeks; z is found by bisection so the test weeks reach 98% fill."
    source: "src/order_forecast/evaluate.py:205-220; inventory.py:72-97; config.py:22-23, :34"
    figures: [F-12, F-13, F-14, F-15, F-28, F-31, F-36, F-37, F-38, F-41, F-42, F-43, F-44, F-45]
    edit: ["src/order_forecast/config.py:23 (VAL_WEEKS), :34 (TARGET_FILL_RATE)"]
    rerun: ["make run", "export_order_list.py + inject_sheet.py"]
  - id: A-06
    statement: "One backtest split: train on weeks before 2025-03-31, 13 validation weeks, 26 test weeks from 2025-06-30. No rolling origin, so there is no interval on any result."
    source: "src/order_forecast/config.py:22-23; outputs/metrics.json split; README 'Known limitations'"
    figures: [F-14, F-27, F-28, F-36, F-37, F-38, F-39, F-40, F-41, F-42, F-43, F-44, F-45, F-46, F-47]
    edit: ["src/order_forecast/config.py:22-23"]
    rerun: ["make run"]
  - id: A-07
    statement: "Unit costs are generated per SKU, so all money figures are in the generator's currency units, not a real currency."
    source: "data/raw/skus.parquet unit_cost; README 'The result' ('Costs are in the same currency units as the generated unit costs')"
    figures: [F-31, F-36, F-37, F-38, F-41, F-42, F-44, F-45]
    edit: ["src/order_forecast/data.py (SKU unit_cost)"]
    rerun: ["make run"]
  - id: A-08
    statement: "The order list on slide 07 is the LightGBM two-stage policy's decision at the end of test week 13 (Friday 2025-09-26). The export script re-runs make run's code for that forecaster and ETS and asserts the result equals outputs/inventory.csv."
    source: "docs/demo/source/tools/export_order_list.py (DECISION_WEEK = 12, assert against outputs/inventory.csv)"
    figures: [F-33, F-34, F-35, F-36, F-37, F-38]
    edit: ["tools/export_order_list.py (DECISION_WEEK, TRACE_SKU_RANK)", "inject_sheet.py --rows"]
    rerun: ["export_order_list.py + inject_sheet.py", "hyperframes render"]
  - id: A-09
    statement: "Video rounding: money and counts to whole numbers with thousands separators, accuracy and AUC to 3 decimals, percentages to 1 decimal; '~9 min' and '523 s' are rounded run times."
    source: "this audit (display convention)"
    figures: [F-21, F-29, F-30, F-31, F-35, F-39, F-40, F-41, F-42, F-43, F-44, F-45, F-46, F-47, F-50]
    edit: ["the composition file named on each slide"]
    rerun: ["hyperframes render"]
  - id: A-10
    statement: "Slide 01 (industries, everyday problems) is general distribution knowledge used as context. It is not a result of this repo and carries no numbers."
    source: "author's framing; README 'The problem' supports problems 2-4"
    figures: [F-01, F-02]
    edit: ["compositions/s01-context.html"]
    rerun: ["hyperframes render"]

figures:
  # ---- slide 01
  - {id: F-01, slides: ["01"], label: "Industries that relate: wholesale & B2B distributors, food & grocery wholesale, consumer-goods supply", shown: "3 industry chips", type: general-knowledge, source: "author's framing", key: "-", formula: "-", manual: "Context statement, not a repo output."}
  - {id: F-02, slides: ["01"], label: "Four everyday problems (lumpy orders; signals in other systems; short shipments; cash on the shelf)", shown: "4 problem cards", type: general-knowledge, source: "README 'The problem' and 'Why it is hard'", key: "README lines 13-35", formula: "-",
     check: {expr: "grep('README.md', r'ships short') and grep('README.md', r'three systems') and grep('README.md', r'cash sits on the shelf') and grep('README.md', r'60% of line-weeks have no order')", fmt: bool}}
  # ---- slide 02
  - {id: F-03, slides: ["02", "05", "08"], label: "Customers and SKUs", shown: "400 customers x 150 SKUs", type: direct, source: "outputs/metrics.json; data/raw/customers.parquet, skus.parquet", key: "scale.customers, scale.skus", formula: "-",
     check: {expr: "(lambda m: f\"{m['customers']} x {m['skus']}\")(J('outputs/metrics.json')['scale'])", fmt: "{}", expect: "400 x 150"}}
  - {id: F-04, slides: ["02"], label: "Active customer x SKU lines", shown: "8,955 customer-SKU lines", type: direct, source: "outputs/metrics.json; recomputed from data/raw/sales_orders.parquet", key: "source_counts.pairs", formula: "distinct (customer, SKU) over non-cancelled order lines",
     check: {expr: "(lambda a, b: a if a == b else -1)(J('outputs/metrics.json')['source_counts']['pairs'], panel_stats()['pairs'])", fmt: "{:,d}", expect: "8,955"}}
  - {id: F-05, slides: ["02"], label: "Forecast horizons", shown: "Weekly, two weeks out", type: direct, source: "src/order_forecast/config.py:25", key: "HORIZONS = (1, 2)", formula: "-",
     check: {expr: "grep('src/order_forecast/config.py', r'HORIZONS = \\(1, 2\\)')", fmt: bool}}
  - {id: F-06, slides: ["02"], label: "Share of line-weeks with no order", shown: "60% of line-weeks: no order", type: derived, source: "outputs/data_profile.json; recomputed from data/raw/sales_orders.parquet", key: "share_zero_line_weeks = 0.5966", formula: "1 - (line-weeks with an order / panel rows) = 0.5966, shown as 60%",
     check: {expr: "round(panel_stats()['zero_share'] * 100)", fmt: "{:d}%", expect: "60%"}}
  - {id: F-07, slides: ["02"], label: "Three source systems joined in SQL; carrying cost 25% a year", shown: "3 systems joined in SQL · holding stock costs 25% a year", type: direct, source: "src/order_forecast/pipeline.py:12 (RAW_TABLES); config.py:32", key: "sales_orders, shipments, field_app_events; ANNUAL_HOLDING_RATE = 0.25", formula: "-",
     check: {expr: "grep('src/order_forecast/pipeline.py', r'\"sales_orders\", \"shipments\", \"field_app_events\"') and grep('src/order_forecast/config.py', r'ANNUAL_HOLDING_RATE = 0.25')", fmt: bool}}
  # ---- slide 03
  - {id: F-08, slides: ["03"], label: "Flow blocks map to code: SQL join, two-stage forecast, safety stock, order-up-to", shown: "3 SOURCES → JOIN → FORECAST → SAFETY STOCK → ORDER-UP-TO → ORDER LIST", type: direct, source: "src/order_forecast/", key: "sql/*.sql, models.py, inventory.py", formula: "-",
     check: {expr: "grep('src/order_forecast/pipeline.py', r'SQL_STAGES') and grep('src/order_forecast/models.py', r'class TwoStage') and grep('src/order_forecast/inventory.py', r'def simulate') and grep('src/order_forecast/inventory.py', r'def z_for_fill_rate')", fmt: bool}}
  - {id: F-09, slides: ["03"], label: "Loop: z tuned until 98% fill", shown: "tune it to hit 98%", type: direct, source: "src/order_forecast/inventory.py:72-97 (bisection); config.py:34", key: "z_for_fill_rate, TARGET_FILL_RATE = 0.98", formula: "-",
     check: {expr: "grep('src/order_forecast/inventory.py', r'by bisection') and grep('src/order_forecast/config.py', r'TARGET_FILL_RATE = 0.98')", fmt: bool}}
  - {id: F-10, slides: ["03"], label: "Badge: 98% of orders filled (two-stage, matched z)", shown: "98% of orders filled", type: direct, source: "outputs/inventory.csv", key: "method=lgbm_two_stage, fill_rate_matched", formula: "-",
     check: {expr: "row('outputs/inventory.csv', method='lgbm_two_stage')['fill_rate_matched'] * 100", fmt: "{:.0f}%", expect: "98%"}}
  - {id: F-11, slides: ["03", "07"], label: "Badge / caption: half the stock cost", shown: "half the stock cost / about half the stock", type: derived, source: "outputs/inventory.csv", key: "holding_cost_matched_fill: lgbm_two_stage 129,047 vs ets 242,371", formula: "129,047 / 242,371 = 0.532 (about half)",
     check: {expr: "0.45 <= row('outputs/inventory.csv', method='lgbm_two_stage')['holding_cost_matched_fill'] / row('outputs/inventory.csv', method='ets')['holding_cost_matched_fill'] <= 0.55", fmt: bool}}
  - {id: F-12, slides: ["03"], label: "Badge: every SKU, weekly", shown: "every SKU, weekly", type: direct, source: "src/order_forecast/inventory.py:1-8; config.py:31", key: "weekly review, all SKUs", formula: "-",
     check: {expr: "grep('src/order_forecast/config.py', r'REVIEW_WEEKS = 1') and grep('src/order_forecast/inventory.py', r'Policy per SKU')", fmt: bool}}
  # ---- slide 04
  - {id: F-13, slides: ["04"], label: "Each forecaster's own validation error sizes its safety stock", shown: "Each forecast's own past misses size its buffer", type: direct, source: "src/order_forecast/evaluate.py:205-209", key: "sigma = RMSE of the forecaster's two-week sum on validation weeks", formula: "-",
     check: {expr: "grep('src/order_forecast/evaluate.py', r'sigma = np.sqrt\\(\\(\\(actual2 - fc2\\) \\*\\* 2\\).mean\\(axis=1\\)\\)')", fmt: bool}}
  - {id: F-14, slides: ["04", "08"], label: "Test window length", shown: "26 held-out weeks", type: direct, source: "outputs/metrics.json", key: "split.test_weeks", formula: "-",
     check: {expr: "J('outputs/metrics.json')['split']['test_weeks']", fmt: "{:d}", expect: "26"}}
  - {id: F-15, slides: ["04"], label: "Bar heights: average stock at 98% fill, ETS vs two-stage (240 px vs 128 px)", shown: "two bars", type: derived, source: "outputs/inventory.csv avg_inventory_value_matched; compositions/explainer.html", key: "969,484 vs 516,188", formula: "128 = round(240 x 516,188 / 969,484)",
     check: {expr: "round(240 * row('outputs/inventory.csv', method='lgbm_two_stage')['avg_inventory_value_matched'] / row('outputs/inventory.csv', method='ets')['avg_inventory_value_matched']) == 128 and grep('demo:compositions/explainer.html', r'height: 128px')", fmt: bool}}
  - {id: F-16, slides: ["04"], label: "Footnote: holding cost vs ETS at 98% fill", shown: "−46.8% holding cost vs ETS", type: derived, source: "outputs/inventory.csv", key: "holding_cost_matched_fill", formula: "(129,047 - 242,371) / 242,371 x 100 = -46.76%",
     check: {expr: "(row('outputs/inventory.csv', method='lgbm_two_stage')['holding_cost_matched_fill'] / row('outputs/inventory.csv', method='ets')['holding_cost_matched_fill'] - 1) * 100", fmt: "{:+.1f}%", expect: "-46.8%"}}
  - {id: F-17, slides: ["09"], label: "The top line-level accuracy score belongs to a costlier model", shown: "The accuracy leader costs the most.", type: derived, source: "outputs/accuracy.csv (h=1 accuracy_pair); outputs/inventory.csv", key: "lgbm_point has max accuracy_pair and higher holding cost than the other boosted models", formula: "argmax accuracy = lgbm_point; its holding cost > each of the other three boosted models",
     check: {expr: "point_is_costlier()", fmt: bool}}
  # ---- slide 05
  - {id: F-18, slides: ["05"], label: "Raw source row counts", shown: "604,527 lines · 592,904 · 279,330", type: direct, source: "outputs/metrics.json source_counts", key: "raw_order_lines, shipments, raw_app_events", formula: "-",
     check: {expr: "(lambda c: f\"{c['raw_order_lines']:,} · {c['shipments']:,} · {c['raw_app_events']:,}\")(J('outputs/metrics.json')['source_counts'])", fmt: "{}", expect: "604,527 · 592,904 · 279,330"}}
  - {id: F-19, slides: ["05"], label: "Cancelled lines dropped by 01_staging.sql", shown: "−11,623 cancelled lines", type: derived, source: "outputs/metrics.json; data/raw/sales_orders.parquet status", key: "raw_order_lines - clean_order_lines", formula: "604,527 - 592,904 = 11,623 (all status = cancelled)",
     check: {expr: "(lambda c: c['raw_order_lines'] - c['clean_order_lines'])(J('outputs/metrics.json')['source_counts'])", fmt: "{:,d}", expect: "11,623"}}
  - {id: F-20, slides: ["05"], label: "API retry duplicates dropped", shown: "−8,136 API retries", type: derived, source: "outputs/metrics.json", key: "raw_app_events - dedup_app_events", formula: "279,330 - 271,194 = 8,136",
     check: {expr: "(lambda c: c['raw_app_events'] - c['dedup_app_events'])(J('outputs/metrics.json')['source_counts'])", fmt: "{:,d}", expect: "8,136"}}
  - {id: F-21, slides: ["05"], label: "Feature panel rows", shown: "1,337,363 line-weeks", type: direct, source: "outputs/metrics.json; recomputed from data/raw/sales_orders.parquet", key: "source_counts.panel_rows", formula: "-",
     check: {expr: "(lambda a, b: a if a == b else -1)(J('outputs/metrics.json')['source_counts']['panel_rows'], panel_stats()['rows'])", fmt: "{:,d}", expect: "1,337,363"}}
  - {id: F-22, slides: ["05"], label: "Training rows for the h=1 models", shown: "fit on 916,478 rows", type: direct, source: "outputs/run_log.txt", key: "'h=1 lgbm_two_stage fitted on 916,478 rows'", formula: "-",
     check: {expr: "grep('outputs/run_log.txt', r'h=1 lgbm_two_stage fitted on 916,478 rows')", fmt: bool}}
  - {id: F-23, slides: ["05"], label: "Every diagram box exists in the code", shown: "data.py, pipeline.py, 01/02/03 *.sql, models.py TwoStage + Tweedie, baseline.py, inventory.py z_for_fill_rate(), cli.py outputs, evaluate.py, metrics.py", type: direct, source: "src/order_forecast/", key: "files + functions", formula: "-",
     check: {expr: "all(grep('src/order_forecast/' + f, p) for f, p in [('data.py', r'def generate'), ('pipeline.py', r'def build_features'), ('sql/01_staging.sql', r'stg_orders'), ('sql/02_panel.sql', r'TABLE panel'), ('sql/03_features.sql', r'TABLE features'), ('models.py', r'class TwoStage'), ('models.py', r'tweedie'), ('baseline.py', r'def ets_forecasts'), ('inventory.py', r'def z_for_fill_rate'), ('cli.py', r'inventory.csv'), ('cli.py', r'accuracy.csv'), ('cli.py', r'results.md'), ('evaluate.py', r'def make_split'), ('metrics.py', r'def wape')])", fmt: bool}}
  - {id: F-24, slides: ["05"], label: "Fallback: if no z reaches 98%, the fixed z = 1.65 result is used", shown: "z = NaN → fixed z = 1.65 fallback", type: direct, source: "src/order_forecast/evaluate.py:220; inventory.py:85-86; config.py:33", key: "np.isfinite(z_star) else fixed", formula: "-",
     check: {expr: "grep('src/order_forecast/evaluate.py', r'if np.isfinite\\(z_star\\) else fixed') and grep('src/order_forecast/config.py', r'SERVICE_Z = 1.65')", fmt: bool},
     note: "Not taken in the published run: every forecaster's z was found (inventory.csv fill_rate_matched = 0.98 for all)."}
