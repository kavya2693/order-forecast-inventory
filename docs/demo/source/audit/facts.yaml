helpers: |
  import re as _re
  _cache = {}
  def panel_stats():
      """Recompute pairs, panel rows and the zero share from the raw order lines (as 01/02 SQL do)."""
      if 'p' not in _cache:
          _P = R.__closure__[0].cell_contents  # the builder's path resolver
          o = pd.read_parquet(_P('data/raw/sales_orders.parquet'))
          c = o[(o['status'] != 'cancelled') & (o['qty_ordered'] > 0)].copy()
          c['w'] = pd.to_datetime(c['order_date']).dt.to_period('W-SUN').dt.start_time
          first = c.groupby(['customer_id', 'sku_id'])['w'].min()
          rows = int(((c['w'].max() - first).dt.days // 7 + 1).sum())
          nz = c[['customer_id', 'sku_id', 'w']].drop_duplicates().shape[0]
          _cache['p'] = {'pairs': len(first), 'rows': rows, 'zero_share': 1 - nz / rows}
      return _cache['p']
  def point_is_costlier():
      acc = R('outputs/accuracy.csv'); acc = acc[acc['horizon'] == 1].set_index('method')['accuracy_pair']
      inv = R('outputs/inventory.csv').set_index('method')['holding_cost_matched_fill']
      boosted = ['lgbm_two_stage', 'xgb_two_stage', 'lgbm_single_tweedie']
      return acc.idxmax() == 'lgbm_point' and all(inv['lgbm_point'] > inv[m] for m in boosted)
  def _block(path, name):
      html = T(path)
      m = _re.search(r"const %s = (\{.*?\}); /\* %s:END" % (name, name), html, _re.S)
      return json.loads(m.group(1))
  def sheet_rows_match():
      """The SHEET block in value.html must equal the exported order list, and the arithmetic must hold."""
      sheet = _block('demo:compositions/value.html', 'SHEET')
      src = {r['sku']: r for r in J('demo:assets/order_list.json')['decision']['rows']}
      for r in sheet['rows']:
          s = src[r['sku']]
          if any(r[k] != s[k] for k in r):
              return False
          if abs(r['forecast_2wk'] + r['safety'] - r['on_hand'] - r['in_transit'] - r['order_qty']) > 0.3:
              return False
      return [r['sku'] for r in sheet['rows']] == ['S0108', 'S0014', 'S0005', 'S0066', 'S0131', 'S0044']
  def trace_matches():
      tr = _block('demo:compositions/s04-routes.html', 'TRACE')
      d = J('demo:assets/order_list.json')
      return (tr['sku'] == d['trace']['sku'] == 'S0032' and tr['demand'] == d['trace']['demand']
              and tr['lgbm'] == d['trace']['forecast_h1_lgbm'] and tr['ets'] == d['trace']['forecast_h1_ets']
              and len(tr['demand']) == J('outputs/metrics.json')['split']['test_weeks'])
  def stock_lines_match():
      d = J('demo:assets/order_list.json'); w = d['warmup_weeks']
      inv = R('outputs/inventory.csv').set_index('method')['avg_inventory_value_matched']
      ok = True
      for m in ('lgbm_two_stage', 'ets'):
          v = d['stock_value_weekly'][m][w:]
          ok = ok and abs(sum(v) / len(v) - inv[m]) < 1.0
      return ok
